name: setup
description: Node from .nvmrc, then a clean install from the lockfile with the npm download cache.

# The checkout comes first in the calling job: a local action is read from the
# working tree, so it cannot check the repository out itself.
inputs:
  install:
    description: Run npm ci. Scripts that import no packages skip it.
    default: 'true'
  astro-cache:
    description: Restore and save Astro's image cache, for jobs that build the site.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install == 'true' && 'npm' || '' }}

    # --no-audit: dependency review and the weekly audit workflow enforce
    # advisories; an install would only print them.
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund

    # Astro writes every encoded image variant to node_modules/.astro keyed by source and
    # options, so a partial restore is still correct. The Pages build cache keeps the same
    # directory.
    - name: Restore the image cache
      if: inputs.astro-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.astro
        key: astro-${{ runner.os }}-${{ hashFiles('src/content/**/*.png', 'src/content/**/*.jpg', 'src/content/**/*.jpeg', 'src/content/**/*.webp', 'astro.config.ts', 'package-lock.json') }}
        restore-keys: astro-${{ runner.os }}-
