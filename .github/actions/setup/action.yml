name: setup
description: The mise toolchain and environment from mise.toml, then a clean install from the lockfile with the npm download cache.

# The calling job checks out first: these steps read mise.toml and
# package-lock.json from the working tree.
inputs:
  install:
    description: Run npm ci. Scripts that import no packages skip it.
    default: 'true'
  astro-cache:
    description: Restore and save Astro's image cache, for jobs that build the site.
    default: 'false'

runs:
  using: composite
  steps:
    # The mise release mise.toml's min_version names, so CI runs the mise a
    # laptop is held to.
    - name: Read the mise version
      id: mise
      shell: bash
      run: echo "version=$(sed -n 's/^min_version = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

    # Installs the tools mise.lock records, checksums included (MISE_LOCKED), and
    # exports mise.toml's [env] to every later step.
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      env:
        MISE_LOCKED: '1'
      with:
        version: ${{ steps.mise.outputs.version }}

    - name: Restore the npm download cache
      if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-

    # --no-audit: dependency review and the weekly audit workflow enforce
    # advisories; an install would only print them.
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund

    # Astro writes every encoded image variant to node_modules/.astro keyed by source and
    # options, so a partial restore is still correct. The Pages build cache keeps the same
    # directory.
    - name: Restore the image cache
      if: inputs.astro-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.astro
        key: astro-${{ runner.os }}-${{ hashFiles('src/content/**/*.png', 'src/content/**/*.jpg', 'src/content/**/*.jpeg', 'src/content/**/*.webp', 'astro.config.ts', 'package-lock.json') }}
        restore-keys: astro-${{ runner.os }}-
