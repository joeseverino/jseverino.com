name: link check

on:
  pull_request:
    branches: [main]
    # Every doc in mise.toml's vars.docs, held to it by tests/unit/link-check-workflow.test.ts.
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - '.github/SECURITY.md'
      - '.github/CONTRIBUTING.md'
      - 'docs/**/*.md'
      - 'tests/*.md'
      - 'src/content/**/*.md'
      - 'src/content/**/*.mdx'
      - 'mise.toml'
  schedule:
    - cron: '37 11 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The links:* tasks (mise.toml) hold the checks; each writes its Markdown report
# into its step's summary, and its failures into the log.
jobs:
  lychee:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: aqua:lycheeverse/lychee
      # lychee checks github.com links through the API with this token, under its
      # rate limit instead of the anonymous one.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: 'false'

      # Neither check imports a package, so nothing is installed for them.
      - name: Check repository documentation links
        run: mise run --no-deps links:docs --format markdown --output "$GITHUB_STEP_SUMMARY"

      - name: Check public content links
        if: ${{ !cancelled() }}
        run: mise run --no-deps links:content --format markdown --output "$GITHUB_STEP_SUMMARY"
