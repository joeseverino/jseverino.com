name: deploy
run-name: 'deploy ${{ github.event.workflow_run.head_branch }}: ${{ github.event.workflow_run.display_title }}'

# Deploys main's build to production once ci passes, then attests it and commits it to the dist
# branch. Pull requests go to preview.yml. A workflow_run job runs the default branch's code; a
# fork's pull request from a branch named main also matches the branch filter, which is why the tip
# job admits only a push. Each deploy reports on the commit it shipped through the deploy check-run
# (.github/actions/deploy-check).
# zizmor's dangerous-triggers finding is accepted on the line below: a push to main is the only
# event that reaches a job, and every checkout is a commit already on main.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: node,npm
  # No package install script runs in a job that holds a secret, whatever
  # package.json's allowScripts approves.
  npm_config_ignore_scripts: 'true'

jobs:
  # ci runs can finish out of order, so only main's tip deploys. A superseded commit's deploy
  # check passes at once, naming the commit that carries it live, so `site land` never waits on it.
  tip:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Compare with main's tip
        id: tip
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          echo "current=$([ "$tip" = "$SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf '## Deploy\n\nSuperseded by %s, whose deploy ships this commit too.\n' "$tip" > "$RUNNER_TEMP/summary-deploy.md"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Check out
        if: steps.tip.outputs.current == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the deploy check
        if: steps.tip.outputs.current == 'false'
        id: check
        uses: $/.github/actions/deploy-check
        with:
          sha: ${{ env.SHA }}

      - name: Pass the deploy check
        if: steps.tip.outputs.current == 'false'
        uses: $/.github/actions/deploy-check
        with:
          id: ${{ steps.check.outputs.id }}
          status: success
          summary: ${{ runner.temp }}/summary-deploy.md

  # main's tip, uploaded as a version and verified at that version's preview URL before it takes
  # any traffic (jseverino.com is behind Bot Fight Mode, which challenges the runner), then
  # deployed to all of it. The checkout is the deployed commit.
  production:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ github.event.repository.homepage }}
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Open the deploy check
        id: check
        uses: $/.github/actions/deploy-check
        with:
          sha: ${{ env.SHA }}

      - name: Set up the toolchain
        uses: $/.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload the version
        id: upload
        run: |
          set -euo pipefail
          wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "version-upload") | "version=\(.version_id)", "url=\(.preview_url // error("no preview URL; are preview URLs on?"))"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the version
        run: |
          {
            echo '## Deploy'
            echo
            echo "\`${SHA:0:12}\` is version $VERSION, verified at $URL before it went live."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --origin "$URL"
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          URL: ${{ steps.upload.outputs.url }}
          DEPLOY_SHA: ${{ env.SHA }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy the version
        run: wrangler versions deploy "$VERSION@100%" --yes --config dist/server/wrangler.json --message "$SHA"
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Close the deploy check
        if: always() && steps.check.outputs.id != ''
        uses: $/.github/actions/deploy-check
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

  # The client tree production now serves, packaged with its SBOM and attested, apart from the
  # Cloudflare token. The archive is deterministic, so it is byte for byte the tree that shipped;
  # the SBOM reads the deployed commit's lockfile. A tag's release (release.yml) publishes the
  # four files.
  attest:
    needs: production
    # Production's tip check already implies a head in this repository; CodeQL reads this
    # comparison as the guard on checking out a workflow_run's commit.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TARBALL: jseverino.com-${{ github.event.workflow_run.head_sha }}.tar.gz
      SBOM: jseverino.com-${{ github.event.workflow_run.head_sha }}.cdx.json
    # What the dist commit names as its proof.
    outputs:
      digest: ${{ steps.package.outputs.digest }}
      attestation: ${{ steps.provenance.outputs.attestation-url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: $/.github/actions/setup
        with:
          install: 'false'

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package the build and its SBOM
        id: package
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "$TARBALL" -C dist/client .
          npm sbom --sbom-format=cyclonedx --package-lock-only > "$SBOM"
          echo "digest=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # actions/attest writes SLSA build provenance when given no predicate, and the SBOM
      # predicate when given sbom-path.
      - name: Attest the build's provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Attest the build's SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: ${{ env.SBOM }}

      - name: Gather the release files
        run: |
          mkdir release
          mv "$TARBALL" "$SBOM" release/
          cp "$PROVENANCE" "release/$TARBALL.sigstore.json"
          cp "$SBOM_BUNDLE" "release/$SBOM.sigstore.json"
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.SHA }}
          path: release/
          overwrite: true
          if-no-files-found: error

  # The attested archive, committed to the dist branch: the HTML production serves, readable in
  # the repository. The archive is checked against the digest attest signed before it is unpacked,
  # and the commit names the run, that digest and the attestation. No Cloudflare secret; the one
  # write is the commit.
  dist:
    needs: attest
    # As on attest: the guard CodeQL reads on checking out a workflow_run's commit.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: dist
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: $/.github/actions/setup
        with:
          install: 'false'

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.SHA }}
          path: ${{ runner.temp }}/release

      - name: Publish to the dist branch
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/release/jseverino.com-$SHA.tar.gz
          echo "$DIGEST  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$archive" -C "$RUNNER_TEMP/site"
          node bin/publish-dist.ts "$RUNNER_TEMP/site" --push --archive-sha256 "$DIGEST" --attestation "$ATTESTATION"
        env:
          DIGEST: ${{ needs.attest.outputs.digest }}
          ATTESTATION: ${{ needs.attest.outputs.attestation }}
          GITHUB_TOKEN: ${{ github.token }}
