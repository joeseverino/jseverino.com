name: deploy

# Deploys the build ci gated, once ci passes: a pull request's as an Access-protected preview
# version, a push to main's to production. A workflow_run job runs the default branch's code. The
# preview job never checks out the pull request, but it does hand the pull request's build to
# wrangler beside the Cloudflare token: its Worker bundle is uploaded to run on Cloudflare, and its
# deploy config is read, so bin/wrap-preview.ts first refuses any config key the adapter does not
# write (wrangler would run a `build.command` on the runner) and any other Worker or path.
# Each deploy reports on the commit it shipped through the deploy check-run
# (.github/actions/deploy-check).
# zizmor's dangerous-triggers finding is accepted on the line below for the reason above:
# no job checks out or runs the pull request's code on the runner.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: node

jobs:
  # A version with the branch's alias (wrangler derives it from WORKERS_CI_BRANCH), wrapped in
  # the sitedrift viewer, verified at its own preview URL. It never serves production traffic,
  # and it records no deployment: the environment is here only for the Cloudflare token.
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment:
      name: production
      deployment: false
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      WORKERS_CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/deploy-check
        id: check
        with:
          sha: ${{ env.SHA }}

      - uses: $/.github/actions/setup
        with:
          install: no-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Wrap the build for review
        run: mise run --no-deps preview:wrap
        env:
          WORKERS_CI: '1'

      - name: Upload the version
        id: upload
        run: |
          set -euo pipefail
          wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "version-upload") | "url=\(.preview_url // error("no preview URL; are preview URLs on?"))", "alias=\(.preview_alias_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_CI_GENERATE_PREVIEW_ALIAS: 'true'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the version
        run: |
          {
            echo '## Deploy'
            echo
            echo "The preview of \`${SHA:0:12}\` ($BRANCH) is at ${ALIAS:-$URL}."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --origin "$URL" --preview
        env:
          URL: ${{ steps.upload.outputs.url }}
          ALIAS: ${{ steps.upload.outputs.alias }}
          DEPLOY_SHA: ${{ env.SHA }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - uses: $/.github/actions/deploy-check
        if: always() && steps.check.outputs.id != ''
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summary-deploy.md
          retention-days: 1
          if-no-files-found: ignore

  # ci runs can finish out of order, so only main's tip deploys. A superseded commit's deploy
  # check passes at once, naming the commit that carries it live, so `site land` never waits on it.
  tip:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Compare with main's tip
        id: tip
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "current=$([ "$tip" = "$SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf '## Deploy\n\nSuperseded by %s, whose deploy ships this commit too.\n' "$tip" > "$RUNNER_TEMP/summary-deploy.md"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.current == 'false'
        with:
          persist-credentials: false

      - uses: $/.github/actions/deploy-check
        if: steps.tip.outputs.current == 'false'
        id: check
        with:
          sha: ${{ env.SHA }}

      - uses: $/.github/actions/deploy-check
        if: steps.tip.outputs.current == 'false'
        with:
          id: ${{ steps.check.outputs.id }}
          status: success
          summary: ${{ runner.temp }}/summary-deploy.md

  # main's tip, uploaded as a version and verified at that version's preview URL before it takes
  # any traffic (jseverino.com is behind Bot Fight Mode, which challenges the runner), then
  # deployed to all of it. The checkout is the deployed commit.
  production:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ github.event.repository.homepage }}
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: $/.github/actions/deploy-check
        id: check
        with:
          sha: ${{ env.SHA }}

      - uses: $/.github/actions/setup
        with:
          install: no-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload the version
        id: upload
        run: |
          set -euo pipefail
          wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "version-upload") | "version=\(.version_id)", "url=\(.preview_url // error("no preview URL; are preview URLs on?"))"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the version
        run: |
          {
            echo '## Deploy'
            echo
            echo "\`${SHA:0:12}\` is version $VERSION, verified at $URL before it went live."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --origin "$URL"
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          URL: ${{ steps.upload.outputs.url }}
          DEPLOY_SHA: ${{ env.SHA }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy the version
        run: wrangler versions deploy "$VERSION@100%" --yes --config dist/server/wrangler.json --message "$SHA"
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - uses: $/.github/actions/deploy-check
        if: always() && steps.check.outputs.id != ''
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

  # The client tree production now serves, packaged with its SBOM and attested, apart from the
  # Cloudflare token. The archive is deterministic, so it is byte for byte the tree that shipped;
  # the SBOM reads the deployed commit's lockfile. A tag's release (release.yml) publishes the
  # four files.
  attest:
    needs: production
    # Only a head in this repository: production's tip check already implies it, and CodeQL
    # reads this comparison as the guard on checking out a workflow_run's commit.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TARBALL: jseverino.com-${{ github.event.workflow_run.head_sha }}.tar.gz
      SBOM: jseverino.com-${{ github.event.workflow_run.head_sha }}.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package the build and its SBOM
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "$TARBALL" -C dist/client .
          npm sbom --sbom-format=cyclonedx --package-lock-only > "$SBOM"

      # actions/attest writes SLSA build provenance when given no predicate, and the SBOM
      # predicate when given sbom-path.
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: ${{ env.SBOM }}

      - name: Gather the release files
        run: |
          mkdir release
          mv "$TARBALL" "$SBOM" release/
          cp "$PROVENANCE" "release/$TARBALL.sigstore.json"
          cp "$SBOM_BUNDLE" "release/$SBOM.sigstore.json"
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.SHA }}
          path: release/
          overwrite: true
          if-no-files-found: error

  # The attested archive, committed to the dist branch: the HTML production serves, readable in
  # the repository. No Cloudflare secret; the one write is the commit.
  dist:
    needs: attest
    # Only a head in this repository: production's tip check already implies it, and CodeQL
    # reads this comparison as the guard on checking out a workflow_run's commit.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: dist
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.SHA }}
          path: ${{ runner.temp }}/release

      - name: Publish
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/release/jseverino.com-$SHA.tar.gz" -C "$RUNNER_TEMP/site"
          node bin/publish-dist.ts "$RUNNER_TEMP/site" --push
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The one comment per pull request: ci's job summaries and the preview's, through
  # bin/pr-comment.ts. The checkout is the default branch's, never the pull request's.
  report:
    needs: preview
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script imports no package.
      - uses: $/.github/actions/setup
        with:
          install: 'false'

      - name: Collect the ci run's summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: summary-*
          merge-multiple: true
          path: ${{ runner.temp }}/summaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Collect the preview's summary
        if: needs.preview.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summaries

      - name: Post or update the CI comment
        run: node bin/pr-comment.ts "$RUNNER_TEMP/summaries"
        env:
          PREVIEW: ${{ needs.preview.result }}
          GITHUB_TOKEN: ${{ github.token }}
