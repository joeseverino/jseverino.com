name: deploy

# Deploys the build ci gated, once ci passes: a pull request's as an Access-protected preview
# version, a push to main's to production. A workflow_run job runs the default branch's code, so
# the jobs holding the Cloudflare token never run code from a pull request; its build is data.
# Each deploy reports on the commit it shipped through the deploy check-run
# (.github/actions/deploy-check).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: node

jobs:
  # A version with the branch's alias (wrangler derives it from WORKERS_CI_BRANCH), wrapped in
  # the sitedrift viewer, verified at its own preview URL. It never serves production traffic.
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment:
      name: production
      url: ${{ steps.upload.outputs.alias || steps.upload.outputs.url }}
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/deploy-check
        id: check
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - uses: $/.github/actions/setup
        with:
          install: no-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Wrap the build for review
        run: mise run --no-deps preview:wrap
        env:
          WORKERS_CI: '1'
          WORKERS_CI_BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Upload the version
        id: upload
        run: |
          set -euo pipefail
          npx wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "version-upload") | "version=\(.version_id)", "url=\(.preview_url // "")", "alias=\(.preview_alias_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WORKERS_CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WRANGLER_CI_GENERATE_PREVIEW_ALIAS: 'true'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the version
        run: |
          {
            echo '## Deploy'
            echo
            echo "The preview of \`${SHA:0:12}\` ($BRANCH) is at ${ALIAS:-$URL}."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --version "$VERSION" --preview
        env:
          VERSION: ${{ steps.upload.outputs.version }}
          URL: ${{ steps.upload.outputs.url }}
          ALIAS: ${{ steps.upload.outputs.alias }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - uses: $/.github/actions/deploy-check
        if: always() && steps.check.outputs.id != ''
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summary-deploy.md
          retention-days: 1
          if-no-files-found: ignore

  # main's build goes live, its client tree is packaged and attested as the bytes that shipped,
  # and the deployed version is verified at its preview URL (jseverino.com is behind Bot Fight
  # Mode, which challenges the runner). The checkout is the deployed commit, so the SBOM reads
  # the lockfile that built it.
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ github.event.repository.homepage }}
    permissions:
      actions: read
      attestations: write
      checks: write
      contents: read
      id-token: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TARBALL: jseverino.com-${{ github.event.workflow_run.head_sha }}.tar.gz
      SBOM: jseverino.com-${{ github.event.workflow_run.head_sha }}.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: $/.github/actions/deploy-check
        id: check
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - uses: $/.github/actions/setup
        with:
          install: no-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Before the deploy, from the tree the deploy reads, so the archive is the bytes that ship.
      - name: Package the build and its SBOM
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "$TARBALL" -C dist/client .
          npm sbom --sbom-format=cyclonedx > "$SBOM"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "deploy") | "version=\(.version_id)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}

      - id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: ${{ env.SBOM }}

      # A tag's release (release.yml) publishes these four files for the commit it names.
      - name: Gather the release files
        run: |
          mkdir release
          mv "$TARBALL" "$SBOM" release/
          cp "$PROVENANCE" "release/$TARBALL.sigstore.json"
          cp "$SBOM_BUNDLE" "release/$SBOM.sigstore.json"
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: release/
          if-no-files-found: error

      - name: Verify the deployed version
        run: |
          {
            echo '## Deploy'
            echo
            echo "\`${SHA:0:12}\` is live as version $VERSION."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --version "$VERSION"
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - uses: $/.github/actions/deploy-check
        if: always() && steps.check.outputs.id != ''
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

  # The attested archive, committed to the dist branch: the HTML production serves, readable in
  # the repository. No Cloudflare secret; the one write is the commit.
  dist:
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: dist
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release

      - name: Publish
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/release/jseverino.com-$SHA.tar.gz" -C "$RUNNER_TEMP/site"
          node bin/publish-dist.ts "$RUNNER_TEMP/site" --push
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}

  # The one comment per pull request: ci's job summaries and the preview's. Executes no
  # repository code.
  report:
    needs: preview
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Collect the ci run's summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: summary-*
          merge-multiple: true
          path: summaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Collect the preview's summary
        if: needs.preview.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: summary-deploy
          path: summaries

      - name: Post or update the CI comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW: ${{ needs.preview.result }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const marker = '<!-- ci-summary -->';

            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: sha, per_page: 100,
            });
            const pull = pulls.find((candidate) =>
              candidate.state === 'open' && candidate.head.sha === sha && candidate.head.repo?.full_name === `${owner}/${repo}`);
            if (!pull) {
              core.info(`No open pull request has ${sha} as its head; nothing to comment on.`);
              return;
            }

            const read = (name) => {
              const file = path.join('summaries', `summary-${name}.md`);
              return fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trim().replace(/^## /gm, '### ') : null;
            };
            const parts = ['e2e', 'visual', 'edge'].map(read).filter(Boolean);
            const ci = [`### ci: ${run.conclusion} · [run](${run.html_url})`, ...parts].join('\n\n');
            const preview = process.env.PREVIEW;
            const deploy = preview === 'skipped'
              ? `### Deploy\n\nNothing deployed: ci ${run.conclusion}.`
              : read('deploy') ?? `### Deploy\n\n${preview}: no summary was produced.`;

            const { data: { check_runs: checks } } = await github.rest.checks.listForRef({
              owner, repo, ref: sha, per_page: 100,
            });
            const required = await github.rest.repos.getBranchRules({ owner, repo, branch: run.repository.default_branch });
            const tracked = required.data
              .filter((rule) => rule.type === 'required_status_checks')
              .flatMap((rule) => rule.parameters.required_status_checks.map((check) => check.context));
            const status = [...new Set(tracked)]
              .map((name) => {
                const check = checks.find((candidate) => candidate.name === name);
                return `\`${name}\` ${check ? check.conclusion ?? check.status : 'pending'}`;
              })
              .join(' · ');

            const body = [marker, `## CI for \`${sha.slice(0, 12)}\``, '', status, '', ci, '', deploy, ''].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull.number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
