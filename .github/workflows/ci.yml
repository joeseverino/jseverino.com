name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Pushes to
# main are never cancelled: each one deploys and keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts at once and none depends on another, so a failure reports on its own
# check and a required check is never left skipped (which counts as passing). The build
# job's gated output is what the deploy workflow ships once this run passes.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          astro-cache: 'true'

      # The gate a laptop runs: every static gate, the build, every gate on the
      # build. src/content is the committed snapshot; CI has no vault. The build
      # carries the production site key because it is the one that ships.
      - name: Gates
        run: mise run check
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # The deploy workflow downloads this, unchanged for production and wrapped
      # for a preview. Hidden files hold .well-known/ and the asset ignore list.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # The cross-browser suite runs in Playwright's image for the locked @playwright/test release,
  # which carries all three browsers and their system packages, so the job installs none;
  # Renovate moves the image with the package. The options are Playwright's: the hosted
  # runner's user, who owns the mounted workspace and HOME, and the host's IPC namespace, which
  # Chromium needs for more shared memory than Docker gives a container.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001 --ipc=host
    # Node alone: the suite runs Playwright from the lockfile.
    env:
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          astro-cache: 'true'

      # The suite then serves this build (PREBUILT).
      - name: Build with the test site key
        run: mise run build:browser

      - name: Cross-browser suite
        run: mise run browser:e2e
        env:
          PREBUILT: '1'
          PLAYWRIGHT_REPORT: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.ts 'Cross-browser suite' .cache/test-results/e2e.json
        env:
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-e2e.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            .cache/playwright-report/e2e/
            .cache/test-results/e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-e2e
          path: ${{ runner.temp }}/summary-e2e.md
          retention-days: 1
          if-no-files-found: ignore

  # One job, two legs, each running one browser:* task. `name` keeps the check-run names
  # `visual` and `edge` so the ruleset's required checks match. The visual leg runs on macOS
  # because the baselines are macOS Chromium renders.
  playwright:
    name: ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Node alone: the suites run Playwright and wrangler from the lockfile.
    env:
      MISE_ENABLE_TOOLS: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: visual
            title: Visual baselines
            os: macos-26
            browsers: chromium
            prebuild: false
          - suite: edge
            title: Edge runtime
            os: ubuntu-24.04
            browsers: ''
            prebuild: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          astro-cache: ${{ matrix.prebuild }}

      # A stalled browser download fails here instead of holding the job to its timeout.
      - name: Install browsers
        if: matrix.browsers
        timeout-minutes: 12
        run: mise run setup:browsers
        env:
          BROWSERS: ${{ matrix.browsers }}

      # The suite then serves this build (PREBUILT).
      - name: Build with the test site key
        if: matrix.prebuild
        run: mise run build:browser

      - name: ${{ matrix.title }}
        run: mise run "browser:$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          PREBUILT: ${{ matrix.prebuild && '1' || '' }}
          PLAYWRIGHT_REPORT: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.ts "$TITLE" ".cache/test-results/$SUITE.json"
        env:
          TITLE: ${{ matrix.title }}
          SUITE: ${{ matrix.suite }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-${{ matrix.suite }}.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            .cache/playwright-report/${{ matrix.suite }}/
            .cache/test-results/${{ matrix.suite }}/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-${{ matrix.suite }}
          path: ${{ runner.temp }}/summary-${{ matrix.suite }}.md
          retention-days: 1
          if-no-files-found: ignore
