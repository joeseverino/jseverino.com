name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Pushes to
# main are never cancelled: each one deploys and keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts at once and none depends on another, so a failure reports on its own
# check and a required check is never left skipped (which counts as passing). Cloudflare
# Pages builds and deploys on its own; the deploy workflow verifies it.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          astro-cache: 'true'

      # The gate a laptop runs: every static gate, the build, every gate on the
      # build. src/content is the committed snapshot; CI has no vault.
      - name: Gates
        run: mise run check

  # One job, three legs, each running one browser:* task. `name` keeps the check-run names
  # `e2e`, `visual`, `edge` so the ruleset's required checks match. The visual leg runs on macOS because the baselines
  # are macOS Chromium renders.
  playwright:
    name: ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            title: Cross-browser suite
            os: ubuntu-24.04
            browsers: chromium firefox webkit
            prebuild: true
          - suite: visual
            title: Visual baselines
            os: macos-26
            browsers: chromium
            prebuild: false
          - suite: edge
            title: Edge runtime
            os: ubuntu-24.04
            browsers: ''
            prebuild: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          astro-cache: ${{ matrix.prebuild }}

      # Cache the browser binaries by Playwright version, not by lockfile hash:
      # every dependency update rewrites the lockfile and would otherwise miss.
      - name: Read Playwright version
        if: matrix.browsers != ''
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        if: matrix.browsers != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}

      # The apt install runs in the background while the site builds, then the suite serves
      # that build (PREBUILT).
      - name: Install browsers and build
        run: |
          set -euo pipefail
          pid=''
          if [ -n "$BROWSERS" ]; then
            if [ "$CACHE_HIT" = 'true' ]; then cmd='install-deps'; else cmd='install --with-deps'; fi
            # shellcheck disable=SC2086 # word-split the command and browser list
            npx playwright $cmd $BROWSERS > "$RUNNER_TEMP/browsers.log" 2>&1 &
            pid=$!
          fi
          if [ "$PREBUILD" = 'true' ]; then node tests/browser-test-env.ts build; fi
          if [ -n "$pid" ] && ! wait "$pid"; then cat "$RUNNER_TEMP/browsers.log"; exit 1; fi
        env:
          BROWSERS: ${{ matrix.browsers }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
          PREBUILD: ${{ matrix.prebuild }}

      - name: ${{ matrix.title }}
        run: mise run "browser:$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          PREBUILT: ${{ matrix.prebuild && '1' || '' }}
          PLAYWRIGHT_REPORT: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.ts "$TITLE" "test-results/$SUITE.json"
        env:
          TITLE: ${{ matrix.title }}
          SUITE: ${{ matrix.suite }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-${{ matrix.suite }}.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            playwright-report/${{ matrix.suite }}/
            test-results/${{ matrix.suite }}/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-${{ matrix.suite }}
          path: ${{ runner.temp }}/summary-${{ matrix.suite }}.md
          retention-days: 1
          if-no-files-found: ignore
