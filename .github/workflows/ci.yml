name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Pushes to
# main are never cancelled: each one deploys and keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts at once and none depends on another, so a failure reports as
# a failure on its own check: a required check is never left skipped (which
# counts as passing) because something upstream failed. Cloudflare Pages builds
# and deploys on its own; the deploy workflow verifies it and comments.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Cheap invariants first: an unpinned action or a misaligned lockfile
      # fails here in seconds, collect-all, before the build starts.
      - name: Gate audits
        run: npm run -s gate:check
        env:
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-gate.md

      # The security-txt audit verifies the PGP signature; the public key ships
      # in the repo's WKD directory, so the runner can import it from there.
      - name: Import disclosure public key
        run: gpg --import public/.well-known/openpgpkey/hu/*

      # The same registry-driven gate that runs locally before a push. --no-sync
      # because CI has no vault; src/content is the committed snapshot.
      - name: Publish gate
        run: npm run publish:check -- --no-sync
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-build.md

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Keep the summaries for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-build
          path: |
            ${{ runner.temp }}/summary-gate.md
            ${{ runner.temp }}/summary-build.md
          retention-days: 1
          if-no-files-found: ignore

  # One job, three legs. `name` keeps the check-run names `e2e`, `visual`, and
  # `edge`, so the ruleset's required checks match by name. The edge leg serves
  # the build through the Cloudflare runtime (wrangler) and needs no browser;
  # the visual leg builds tests/fixtures/content and runs on macOS because the
  # baselines are macOS Chromium renders.
  playwright:
    name: ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            title: Cross-browser suite
            os: ubuntu-24.04
            browsers: chromium firefox webkit
            prebuild: true
            config: playwright.config.ts
          - suite: visual
            title: Visual baselines
            os: macos-26
            browsers: chromium
            prebuild: false
            config: playwright.visual.config.ts
          - suite: edge
            title: Edge runtime
            os: ubuntu-24.04
            browsers: ''
            prebuild: true
            config: playwright.edge.config.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Cache the browser binaries by Playwright version, not by lockfile hash:
      # every Dependabot PR rewrites the lockfile and would otherwise miss.
      - name: Read Playwright version
        if: matrix.browsers != ''
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        if: matrix.browsers != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}

      # The apt install (Linux system packages for the browsers; a no-op on
      # macOS) runs in the background while the site builds, then the suite
      # serves that build (PREBUILT) instead of building it again.
      - name: Install browsers and build
        run: |
          set -euo pipefail
          pid=''
          if [ -n "$BROWSERS" ]; then
            if [ "$CACHE_HIT" = 'true' ]; then cmd='install-deps'; else cmd='install --with-deps'; fi
            # shellcheck disable=SC2086 # word-split the command and browser list
            npx playwright $cmd $BROWSERS > "$RUNNER_TEMP/browsers.log" 2>&1 &
            pid=$!
          fi
          if [ "$PREBUILD" = 'true' ]; then node tests/browser-test-env.ts build; fi
          if [ -n "$pid" ] && ! wait "$pid"; then cat "$RUNNER_TEMP/browsers.log"; exit 1; fi
        env:
          BROWSERS: ${{ matrix.browsers }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
          PREBUILD: ${{ matrix.prebuild }}
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: ${{ matrix.title }}
        run: npx playwright test -c "$CONFIG"
        env:
          CONFIG: ${{ matrix.config }}
          PREBUILT: ${{ matrix.prebuild && '1' || '' }}
          PLAYWRIGHT_REPORT: '1'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.ts "$TITLE" "test-results/$SUITE.json"
        env:
          TITLE: ${{ matrix.title }}
          SUITE: ${{ matrix.suite }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-${{ matrix.suite }}.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            playwright-report/${{ matrix.suite }}/
            test-results/${{ matrix.suite }}/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-${{ matrix.suite }}
          path: ${{ runner.temp }}/summary-${{ matrix.suite }}.md
          retention-days: 1
          if-no-files-found: ignore
