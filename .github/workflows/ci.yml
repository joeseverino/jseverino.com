name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Pushes to
# main are never cancelled: each one deploys and deserves its own record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap invariants first: an unpinned action or a misaligned lockfile should
  # fail in under a minute, not after three runners have installed browsers.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Gate audits
        run: npm run -s gate:check
        env:
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-gate.md

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-gate
          path: ${{ runner.temp }}/summary-gate.md
          retention-days: 1
          if-no-files-found: ignore

  # Cloudflare Pages builds the commit on its own infrastructure, triggered by
  # the push rather than by this workflow, and reports back as a check-run.
  # This job gives that deployment a node in the graph and a summary.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Wait for Cloudflare Pages
        run: node bin/deploy-wait.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summary-deploy.md
          retention-days: 1
          if-no-files-found: ignore

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The security-txt audit verifies the PGP signature; the public key ships
      # in the repo's WKD directory, so the runner can import it from there.
      - name: Import disclosure public key
        run: gpg --import public/.well-known/openpgpkey/hu/*

      # The same registry-driven gate that runs locally before a push. --no-sync
      # because CI has no vault; src/content is the committed snapshot.
      - name: Publish gate
        run: npm run publish:check -- --no-sync
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-build.md

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-build
          path: ${{ runner.temp }}/summary-build.md
          retention-days: 1
          if-no-files-found: ignore

  # One job, three legs. `name` keeps the check-run names `e2e`, `visual`, and
  # `edge`, so the ruleset's required checks match by name; the run graph
  # groups the legs as one matrix. The edge leg serves the build through the
  # Cloudflare runtime (wrangler) and needs no browser.
  playwright:
    name: ${{ matrix.suite }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            title: Cross-browser suite
            os: ubuntu-latest
            cache: ~/.cache/ms-playwright
            install: npx playwright install --with-deps chromium firefox webkit
            install-deps: npx playwright install-deps chromium firefox webkit
            command: npm run test:e2e
          - suite: visual
            title: Visual baselines
            os: macos-latest
            cache: ~/Library/Caches/ms-playwright
            install: npx playwright install chromium
            install-deps: 'true'
            command: npm run test:e2e:visual -- --project=chromium-desktop
          - suite: edge
            title: Edge runtime
            os: ubuntu-latest
            cache: ''
            install: 'true'
            install-deps: 'true'
            command: npm run test:edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cache the browser binaries by Playwright version, not by lockfile hash:
      # every Dependabot PR rewrites the lockfile and would otherwise miss.
      - name: Read Playwright version
        if: matrix.cache != ''
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        if: matrix.cache != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ${{ matrix.cache }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # System dependencies are a Linux concern; the macOS leg's install-deps
      # is a no-op.
      - name: Install browsers
        if: matrix.cache != '' && steps.browsers.outputs.cache-hit != 'true'
        run: ${{ matrix.install }}

      - name: Install system dependencies for cached browsers
        if: matrix.cache != '' && steps.browsers.outputs.cache-hit == 'true'
        run: ${{ matrix.install-deps }}

      - name: ${{ matrix.title }}
        run: ${{ matrix.command }}
        env:
          CI: '1'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.mjs "$TITLE"
        env:
          TITLE: ${{ matrix.title }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-${{ matrix.suite }}.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-${{ matrix.suite }}
          path: ${{ runner.temp }}/summary-${{ matrix.suite }}.md
          retention-days: 1
          if-no-files-found: ignore

  # Stitches every job's summary into one comment on the pull request, updated
  # in place on each push. Pull requests only: a push to main has no thread.
  report:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [gate, build, playwright, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Collect job summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: summary-*
          merge-multiple: true
          path: summaries

      - name: Post or update the summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- ci-summary -->';
            // [summary file, job the outcome comes from]
            const sections = [['gate', 'gate'], ['build', 'build'], ['e2e', 'playwright'], ['visual', 'playwright'], ['edge', 'playwright'], ['deploy', 'deploy']];
            const results = JSON.parse(process.env.RESULTS);
            const pull = context.payload.pull_request;
            const sha = pull.head.sha.slice(0, 12);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = (job) => results[job]?.result ?? 'unknown';

            const rendered = sections.map(([name, job]) => {
              const file = path.join('summaries', `summary-${name}.md`);
              if (!fs.existsSync(file)) return `### ${name}\n\n${outcome(job)}: no summary was produced.`;
              return fs.readFileSync(file, 'utf8').trim().replace(/^## /gm, '### ');
            });

            const status = [...new Set(sections.map(([, job]) => job))]
              .map((job) => `\`${job}\` ${outcome(job)}`)
              .join(' · ');

            const body = [
              marker,
              `## CI for \`${sha}\``,
              '',
              `${status} · [run](${runUrl})`,
              '',
              ...rendered.flatMap((section) => [section, '']),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body,
              });
            }
