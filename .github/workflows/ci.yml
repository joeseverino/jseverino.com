name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap invariants first: an unpinned action or a misaligned lockfile should
  # fail in under a minute, not after three runners have installed browsers.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Gate audits
        run: npm run -s gate:check

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The security-txt audit verifies the PGP signature; the public key ships
      # in the repo's WKD directory, so the runner can import it from there.
      - name: Import disclosure public key
        run: gpg --import public/.well-known/openpgpkey/hu/*

      # The same registry-driven gate that runs locally before a push. --no-sync
      # because CI has no vault; src/content is the committed snapshot.
      - name: Publish gate
        run: npm run publish:check -- --no-sync
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  e2e:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cache the browser binaries by Playwright version, not by lockfile hash:
      # every Dependabot PR rewrites the lockfile and would otherwise miss.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install system dependencies for cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Cross-browser suite
        run: npm run test:e2e
        env:
          CI: '1'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.mjs "Cross-browser suite"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore cached browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Visual baselines
        run: npm run test:e2e:visual -- --project=chromium-desktop
        env:
          CI: '1'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Summarize results
        if: always()
        run: node bin/playwright-summary.mjs "Visual baselines"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Probes the production deployment once the code that produced it has passed
  # every gate above. Skipped on pull requests: there is nothing live to probe.
  verify:
    if: github.event_name != 'pull_request'
    needs: [build, e2e, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      security-events: read
      issues: write
    # Only the newest push to main is worth verifying; an older run would probe
    # a production deployment that has already been replaced.
    concurrency:
      group: deploy-verify
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # No npm ci: the script imports only repo files, and npm audit reads the
      # lockfile. Keeps install scripts out of a job that can read alerts.
      - name: Verify the production deployment
        run: node bin/deploy-verify.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or close the verification issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const label = 'deploy-verify';
            const failed = process.env.OUTCOME !== 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 12);

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (!failed) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Production verified clean at \`${sha}\`: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const title = 'Production deployment failed post-deploy verification';
            const body = [
              `\`bin/deploy-verify.mjs\` failed against the live site after \`${sha}\` landed on \`main\`.`,
              '',
              `Run with the per-check table: ${runUrl}`,
              '',
              'Cloudflare Pages keeps serving the last successful build, so a failed *build* is not an outage.',
              'A failing check on a *successful* build is: roll back the Pages deployment in the dashboard if the site is affected, then fix forward.',
              '',
              'This issue closes itself when a later verification run passes.',
            ].join('\n');

            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Still failing at \`${sha}\`: ${runUrl}`,
              });
            }
