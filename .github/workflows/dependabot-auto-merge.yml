name: dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-merge:
    # Only PRs Dependabot authored, only on pushes Dependabot itself made (a
    # human commit onto its branch must not re-arm auto-merge), and never on a
    # fork of this repository.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.repository == 'joeseverino/jseverino.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependabot.yml ignores semver-major; this guard holds if that loosens. sitedrift is
      # bundled into the edge functions, so its updates wait for a human. Required checks
      # still gate the merge.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && !contains(steps.metadata.outputs.dependency-names, 'sitedrift')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
