name: scorecard

# Publishes the score to the OpenSSF API, which serves the README's badge, and sends the findings
# to code scanning. The API accepts a result only from a workflow it can verify: no workflow-level
# env, defaults or write permission, and a job of hosted-Ubuntu steps from its approved actions
# that alone holds id-token: write.
on:
  branch_protection_rule:
  schedule:
    - cron: '19 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs the published result, so the API knows this repository's workflow produced it.
      id-token: write
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
