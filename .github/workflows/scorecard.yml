name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '19 12 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: scorecard.sarif

      # The SARIF above lists only the checks with findings. A second pass in
      # JSON carries every check and the aggregate, which is what the summary
      # shows.
      - name: Run OpenSSF Scorecard for the summary
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Summarize
        run: node bin/scorecard-summary.mjs scorecard.json

      - name: Upload Scorecard reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scorecard-reports
          path: |
            scorecard.sarif
            scorecard.json
          if-no-files-found: error
