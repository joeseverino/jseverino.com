name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The security-txt audit verifies the PGP signature; the public key ships
      # in the repo's WKD directory, so the runner can import it from there.
      - run: gpg --import public/.well-known/openpgpkey/hu/*

      # The same registry-driven gate that runs locally before a push. --no-sync
      # because CI has no vault; src/content is the committed snapshot.
      - run: npm run publish:check -- --no-sync
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
