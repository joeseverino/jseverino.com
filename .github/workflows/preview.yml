name: preview
run-name: 'preview ${{ github.event.workflow_run.head_branch }}: ${{ github.event.workflow_run.display_title }}'

# Deploys a pull request's build, once ci passes, as an Access-protected preview version, and keeps
# one comment on the pull request current. main's builds go to deploy.yml. A workflow_run job runs
# the default branch's code. The preview job never checks out the pull request, but it does hand
# the pull request's build to wrangler beside the Cloudflare token: its Worker bundle is uploaded to
# run on Cloudflare, and its deploy config is read, so bin/wrap-preview.ts first refuses any config
# key the adapter does not write (wrangler would run a `build.command` on the runner) and any other
# Worker or path. The preview reports on the commit it shipped through the deploy check-run
# (.github/actions/deploy-check).
# zizmor's dangerous-triggers finding is accepted on the line below for the reason above:
# no job checks out or runs the pull request's code on the runner.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches-ignore: [main]

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: node,npm
  # No package install script runs in a job that holds a secret, whatever
  # package.json's allowScripts approves.
  npm_config_ignore_scripts: 'true'

jobs:
  # A version with the branch's alias (wrangler derives it from WORKERS_CI_BRANCH), wrapped in
  # the sitedrift viewer, verified at its own preview URL. It never serves production traffic,
  # and it records no deployment: the environment is here only for the Cloudflare token.
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    environment:
      name: production
      deployment: false
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      WORKERS_CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the deploy check
        id: check
        uses: $/.github/actions/deploy-check
        with:
          sha: ${{ env.SHA }}

      - name: Set up the toolchain
        uses: $/.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Wrap the build for review
        run: mise run preview:wrap
        env:
          WORKERS_CI: '1'

      - name: Upload the version
        id: upload
        run: |
          set -euo pipefail
          wrangler versions upload --config dist/server/wrangler.json --tag "${SHA:0:12}" --message "$SHA"
          jq -r 'select(.type == "version-upload") | "url=\(.preview_url // error("no preview URL; are preview URLs on?"))", "alias=\(.preview_alias_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_CI_GENERATE_PREVIEW_ALIAS: 'true'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the version
        run: |
          {
            echo '## Deploy'
            echo
            echo "The preview of \`${SHA:0:12}\` ($BRANCH) is at ${ALIAS:-$URL}."
            echo
          } > "$JOB_SUMMARY_FILE"
          node bin/deploy-verify.ts --origin "$URL" --preview
        env:
          URL: ${{ steps.upload.outputs.url }}
          ALIAS: ${{ steps.upload.outputs.alias }}
          DEPLOY_SHA: ${{ env.SHA }}
          JOB_SUMMARY_FILE: ${{ runner.temp }}/summary-deploy.md
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Close the deploy check
        if: always() && steps.check.outputs.id != ''
        uses: $/.github/actions/deploy-check
        with:
          id: ${{ steps.check.outputs.id }}
          status: ${{ job.status }}
          summary: ${{ runner.temp }}/summary-deploy.md

      - name: Upload the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summary-deploy.md
          retention-days: 1
          if-no-files-found: ignore

  # The one comment per pull request: ci's job summaries and the preview's, through
  # bin/pr-comment.ts. It runs whatever ci concluded, so a failed run is reported too. The checkout
  # is the default branch's, never the pull request's.
  report:
    needs: preview
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script imports no package.
      - name: Set up the toolchain
        uses: $/.github/actions/setup
        with:
          install: 'false'

      - name: Download ci's summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: summary-*
          merge-multiple: true
          path: ${{ runner.temp }}/summaries
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the preview's summary
        if: needs.preview.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: summary-deploy
          path: ${{ runner.temp }}/summaries

      - name: Post or update the CI comment
        run: node bin/pr-comment.ts "$RUNNER_TEMP/summaries"
        env:
          PREVIEW: ${{ needs.preview.result }}
          GITHUB_TOKEN: ${{ github.token }}
