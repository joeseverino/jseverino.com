name: security.txt expires

on:
  schedule:
    # First of every month at 09:00 UTC.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expires:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Import disclosure public key
        run: gpg --import public/.well-known/openpgpkey/hu/*

      - name: Check security.txt Expires
        id: check
        run: |
          set -euo pipefail
          OUTPUT=$(node tests/audits/check-security-txt.mjs 2>&1) || {
            echo "$OUTPUT"
            echo "::error::check-security-txt.mjs failed; expiry not evaluated."
            exit 1
          }
          echo "$OUTPUT"
          DAYS_REMAINING=$(printf '%s\n' "$OUTPUT" | grep -oE 'expires in [0-9]+d' | grep -oE '[0-9]+')
          echo "days_remaining=$DAYS_REMAINING" >> "$GITHUB_OUTPUT"
          if [ "$DAYS_REMAINING" -lt 60 ]; then
            echo "expires_soon=true" >> "$GITHUB_OUTPUT"
          else
            echo "expires_soon=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue
        if: steps.check.outputs.expires_soon == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const days = ${{ steps.check.outputs.days_remaining }};
            const title = 'security.txt Expires within 60 days — rotate signature';
            const body = [
              `\`public/.well-known/security.txt\` expires in **${days} days**.`,
              '',
              'Action required:',
              '',
              '1. Bump the `Expires:` field in `public/.well-known/security.txt`.',
              '2. Run `npm run sign:security` to re-sign.',
              '3. Run `npm run check:security` to verify.',
              '4. Commit and push.',
              '',
              'This issue was opened automatically by `.github/workflows/security-txt-expires.yml`.',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-txt-expires',
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-txt-expires'],
              });
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            }
