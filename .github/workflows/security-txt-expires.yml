name: security.txt expires

# Fails from 60 days before Expires; GitHub emails the failed scheduled run.
on:
  schedule:
    # First of every month at 09:00 UTC.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expires:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: 'false'

      - name: Check security.txt Expires
        run: mise run checks:security-txt
