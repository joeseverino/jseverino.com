name: release

# A version tag (signed by convention, docs/Release-Checklist.md §4; the
# trigger matches any v* tag) publishes the tagged commit's production deploy as a
# verifiable release: the archive of the static site the deploy shipped and its SBOM,
# each with the Sigstore attestation the deploy workflow issued. Nothing is rebuilt. The release is
# published with its files already attached, so it is complete once immutable releases lock it
# (.github/repo.json), and GitHub attests it. Verify with:
#   gh attestation verify jseverino.com-<tag>.tar.gz -R joeseverino/jseverino.com
#   gh release verify <tag> -R joeseverino/jseverino.com
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi

      # The deploy workflow keeps the release files of each production deploy as an
      # artifact named for its commit, so a tag on a commit main never deployed fails here.
      - name: Fetch the deployed release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-$SHA" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$run" ]; then
            echo "::error::no unexpired production deploy of $SHA; tag a commit main deployed in the last 90 days"
            exit 1
          fi
          gh run download "$run" -n "release-$SHA" -D release
          for file in release/*; do mv "$file" "${file/$SHA/$TAG}"; done

      # Given files, gh release create makes a draft, uploads each file, then publishes it, and
      # deletes the draft if an upload fails, so a release is never seen without its files.
      - name: Publish the release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
