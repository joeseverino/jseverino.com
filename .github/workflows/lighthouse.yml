name: lighthouse

on:
  schedule:
    - cron: '11 13 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lighthouse comes from the lockfile (Dependabot keeps it current), so
      # the scores here use the same Lighthouse generation PageSpeed Insights
      # scores with. URLs and thresholds live in .lighthouserc.json.
      - name: Audit the live site
        run: npm run -s check:lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
