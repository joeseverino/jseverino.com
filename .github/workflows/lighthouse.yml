name: lighthouse

on:
  schedule:
    - cron: '11 13 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Install audit browser
        run: npx playwright install --with-deps chromium

      # Lighthouse comes from the lockfile (Renovate keeps it current), so
      # the scores here use the same Lighthouse generation PageSpeed Insights
      # scores with. URLs and thresholds live in tests/lighthouse.json.
      - name: Audit the live site
        run: mise run lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
