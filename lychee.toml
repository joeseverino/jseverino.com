# lychee reads this file by default from the repository root, so every run
# shares it: the offline gates (`mise run built:links`, `mise run checks:doc-links`)
# and the external link check workflow. The offline-only flags (--offline,
# --include-fragments, --root-dir, --remap) stay on those tasks' command lines,
# since --root-dir must be absolute and the external check must stay online.

# Paths the build has no file for: the Worker routes (`run_worker_first` in
# wrangler.jsonc), and Cloudflare's own /cdn-cgi/. Matched once resolved
# against the build root, so an external URL never matches.
exclude = ['^file://.*/dist/client/(?:api|__sitedrift|cdn-cgi)/']
