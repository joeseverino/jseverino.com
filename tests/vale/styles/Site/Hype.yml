# A claim of quality says nothing a reader can check, and these words and
# phrases are the marks of generated copy: name what the thing does instead.
# The filler adverbs at the end add emphasis and no fact.
extends: existence
message: "'%s' praises or pads instead of describing; say what it does"
level: error
ignorecase: true
scope: raw
tokens:
  - seamless(?:ly)?
  - effortless(?:ly)?
  - blazing(?:ly)?(?:[- ]fast)?
  - lightning[- ]fast
  - cutting[- ]edge
  - game[- ]chang(?:er|ing)
  - world[- ]class
  - best[- ]in[- ]class
  - state[- ]of[- ]the[- ]art
  - next[- ]generation
  - next[- ]level
  - supercharg(?:e|es|ed|ing)
  - unleash(?:es|ed|ing)?
  - delightful(?:ly)?
  - revolutionary
  - unparalleled
  - rock[- ]solid
  - battle[- ]tested
  - zero[- ]drift
  - self[- ]healing
  - continuous\s+trust
  - unified\s+verification
  - paradigm\s+shift
  - synerg(?:y|ies|istic)
  - delv(?:e|es|ed|ing)
  - fast[- ]paced
  - ever[- ](?:evolving|changing)
  - (?:unlock|harness|leverage)\s+the\s+power
  - elevate\s+your
  - it['’]s\s+worth\s+noting
  - needless\s+to\s+say
  - in\s+conclusion
  - robust
  - comprehensive(?:ly)?
  - powerful(?:ly)?
  - leverag(?:e|es|ed|ing)
  - cleanly
  - fully
  - actually
  - simply
  - easily
  - just
