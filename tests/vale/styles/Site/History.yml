# A doc says what the repository does now. How it came to be belongs in the
# commit message: narration is read as a description long after it stopped
# being true, and none of these phrases can describe present behavior. A dated
# record kept as one by design (a scanner's result) opens with
# <!-- vale Site.History = NO --> and closes with = YES.
extends: existence
message: "'%s' narrates history; say what it does now"
level: error
ignorecase: true
scope: raw
tokens:
  - used\s+to\s+be
  - the\s+first\s+version
  - the\s+old\s+version
  - reached\s+production
  - turned\s+out
  - until\s+now
  - until\s+recently
  - this\s+regression
  - the\s+bug\s+(?:that|was)
  - shipped\s+(?:once|unstyled|for\s+a\s+while)
  - we\s+(?:had|used|found|added|removed|changed|tried)
  - now\s+also
  - evaluated\s+on
  - replaced\s+the
  - moved\s+(?:out|into|from)
  - started\s+with
  - went\s+back
  - was\s+(?:split|moved|added|removed|renamed)
  - not\s+used\s+yet
  - pending\s+a\s+decision
  - now\s+(?:serves|ships|runs|uses|lives|carries|holds)
  - previously
  - originally
  - formerly
  - the\s+legacy\s+platform
  - (?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}
  - '(?<=\()\d{4}-\d{2}-\d{2}(?=[),])'
