# Vale holds the engineering docs to the repository's wording rules
# (mise run checks:prose): no em dash (Dash), no praise or filler (Hype), no
# "not X, but Y" (Contrast), no narration of how the code came to be (History),
# headings in sentence case (Headings), and no gate called by a name no task
# has (GateTerms).
#
# Vale reads StylesPath from this file's directory, and the gate runs it from
# the repository root with --config naming this file.
StylesPath = styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Site
# mise writes the task list in docs/Commands.md (checks:docs-sync) and spells
# an argument's help with an em dash. Dash reads text, which this leaves out;
# the other rules read the raw file, task descriptions included.
BlockIgnores = (?s)(<!-- mise-tasks -->.*?<!-- /mise-tasks -->)

# The migration page is the migration's dated record, so its dates and its
# account of what moved are its content.
[docs/WordPress-To-Astro-Migration.md]
Site.History = NO
