# The toolchain, the environment, the entry points and the operator's tools.
#
#   mise install        the pinned tools (versions here, checksums in mise.lock)
#   mise run <task>     first installs the npm packages when package.json or
#                       package-lock.json changed ([deps.npm]), then the task
#   mise run fast       the static gates, collect-all
#   mise run check      does my change work: the static gates, the production
#                       build, then every gate on what it built
#   mise run browser    the browser suites, one at a time
#   mise run ci         every gate the pipeline runs
#   mise run <gate>     one gate a verdict names, e.g. `mise run checks:types`
#   mise tasks          the entry points and tools; --hidden adds every gate
#
# A gate is a task named <job>:<gate>, declared in its job's file under
# mise-tasks/ (mise-tasks/checks.toml for checks:*), mise's default task
# directory, where it reads every .toml as a task file and every executable as
# a file task. checks:* run before a build, built:* against the build in
# dist/client/, browser:* in a browser. Each aggregate runs its job by glob
# (`mise run -c 'checks:*'`), so a gate added there runs locally and in CI with
# no second list to edit. Every gate is `hide = true`: the glob and
# `mise run <gate>` still reach it. `-c` keeps going past a failure and names
# every gate that failed. Under `-c` a task whose dependency failed still
# starts, so no built:* gate depends on the build: the aggregates run the build
# first and the built:* gates only after it succeeded. A failing gate prints
# its own fix. No gate declares `sources`: a verdict also turns on the
# environment and on files no list would name. Commands that run in sequence
# are a `run` array; a body that branches or keeps a status is a file under
# mise-tasks/, declared in its own #MISE header.
#
# Node is pinned here alone; checks:repo-policy holds engines.node and the
# packageManager npm to it. npm packages come from package-lock.json;
# node_modules/.bin is on every task's PATH.

# The mise these tasks run on: the floor for every machine and the release CI
# installs (.github/actions/setup). Renovate moves it after its release-age hold.
min_version = "2026.10.18"

[settings]
# For [deps], mise's package installer.
experimental = true
# Every tool installs from mise.lock's URLs and checksums, which cover these
# platforms: the Mac and the Linux CI runners.
locked = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[settings.task]
# Gates that run together print one after another, each whole and labeled,
# so each gate's failures sit under its own name.
output = "keep-order"

# A clean install from the lockfile, run before any `mise run` or `mise exec`
# while package.json or package-lock.json differs from the last install or
# node_modules is missing. --no-audit: dependency review and Renovate's alerts
# enforce advisories; an install would only print them. npm's output goes to
# stderr, so a task whose stdout another program reads (`site --json`) still
# prints only its own. CI installs in its setup action, and a job that holds a
# secret installs nothing and runs its task with `mise run --no-deps`, so no
# package install script sees the secret.
[deps.npm]
auto = true
run = "npm ci --no-audit --no-fund >&2"

[env]
_.path = ["node_modules/.bin"]
ASTRO_TELEMETRY_DISABLED = "1"
# One cache root for every checkout and worktree of this repository: the
# content sync's image masters under it, and Astro's encoded images in astro/.
SITE_CACHE_DIR = "{{ xdg_cache_home }}/jseverino.com"
ASTRO_CACHE_DIR = "{{ env.SITE_CACHE_DIR }}/astro"
WRANGLER_SEND_METRICS = "false"

[vars]
# The engineering docs the docs gates read, as git pathspecs, so a gate reads
# only tracked files and never a local or untracked copy.
docs = "README.md AGENTS.md .github/SECURITY.md .github/CONTRIBUTING.md 'docs/*.md' ':(glob)tests/*.md'"
# The statuses the online link checks (links:*) count as a live link.
links_accept = "200,204,206,301,302,303,307,308,403,429,999"

# `mise doctor project`: is this checkout ready to work in. Local only and
# never a gate: CI has no gh login, and these describe the machine, not the
# change.
[doctor.checks.packages]
description = "node_modules is installed from the current package.json and package-lock.json"
run = "mise deps install npm --explain"
hint = "Run `mise deps install npm --force`."

[doctor.checks.gh]
description = "gh is signed in, for site publish, site land and deploy:verify"
run = "gh auth status"
hint = "Run `gh auth login`."

[doctor.checks.cache]
description = "The cache root every checkout and worktree shares exists"
run = "test -d \"$SITE_CACHE_DIR\""
hint = "Run `mise exec -- sh -c 'mkdir -p \"$SITE_CACHE_DIR\"'`; the first build or content sync also creates it."

[doctor.checks.browsers]
description = "Playwright's Chromium, Firefox and WebKit are installed, for the browser suites"
run = "node -e 'const fs = require(\"node:fs\"); const playwright = require(\"@playwright/test\"); process.exit([\"chromium\", \"firefox\", \"webkit\"].every((name) => fs.existsSync(playwright[name].executablePath())) ? 0 : 1)'"
hint = "Run `mise exec -- playwright install chromium firefox webkit`."
# It loads @playwright/test from node_modules.
depends = ["packages"]

# A tool one gate or one task runs is lazy: `mise install` leaves it out, and
# the first run of its command installs it from mise.lock. A tool named by its
# backend lists its commands in lazy_bins, which mise makes into the shims
# that install it.
[tools]
node = "26.13.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:biomejs/biome" = "2.6.4"

[tools."aqua:zizmorcore/zizmor"]
version = "1.31.1"
lazy = true
lazy_bins = ["zizmor"]

[tools."github:jdx/jactionlint"]
version = "2.4.0"
lazy = true
lazy_bins = ["jactionlint"]

# checks:shellcheck, and jactionlint on every workflow `run:` script.
[tools."aqua:koalaman/shellcheck"]
version = "0.11.0"
lazy = true
lazy_bins = ["shellcheck"]

# make:font's uvx.
[tools."aqua:astral-sh/uv"]
version = "0.13.6"
lazy = true
lazy_bins = ["uv", "uvx"]

[tools."aqua:vale-cli/vale"]
version = "3.25.1"
lazy = true
lazy_bins = ["vale"]

# ------------------------------------------------------------ entry points
# The aggregates CI's jobs and the inner loop run, and the builds they serve.

[tasks.checks]
description = "CI job build, first phase: every static gate, collect-all"
alias = "fast"
run = "mise run -c 'checks:*'"

[tasks.build]
description = "The build every deploy ships: astro build, then the CSP hashes"
timeout = "10m"
run = "node bin/build-static.ts"

[tasks.built]
description = "CI job build, last phase: every gate on the build in dist/client/, collect-all"
run = "mise run -c 'built:*'"

[tasks."build:browser"]
description = "The build the browser suites serve under PREBUILT: the deploy build, with the test site key"
timeout = "10m"
run = "node tests/browser-test-env.ts build"

# One suite at a time (-j 1): each starts browsers and a server, and two at
# once exhaust a small machine's memory. The suites serve this one build.
[tasks.browser]
description = "Every browser gate, one at a time: one build with the test site key, then each suite"
timeout = "45m"
env = { PREBUILT = "1" }
run = ["mise run build:browser", "mise run -c -j 1 'browser:*'"]

[tasks.ci]
description = "Every gate the pipeline runs: check, then the browser suites"
timeout = "90m"
run = "mise run -c -j 1 check ::: browser"

# ------------------------------------------------------------------- links
# Every external link, online. Never a gate: the verdict turns on other sites,
# so the link check workflow runs these weekly and on a pull request that
# touches a document. 403, 429 and 999 come from sites that wall off automated
# clients, and a link that answers at all is not dead; a 404 or a connection
# failure still fails. Arguments after the task name go to lychee: CI adds
# `--format markdown --output "$GITHUB_STEP_SUMMARY"`.

[tasks."links:docs"]
description = "Every external link in the engineering docs answers (online)"
run = "lychee --no-progress --verbose --accept {{vars.links_accept}} $(git ls-files -- {{vars.docs}})"

[tasks."links:content"]
description = "Every external link in the published content answers (online); links to jseverino.com itself are built:links' job"
# A page a pull request adds would 404 on the live site until it deploys.
run = "lychee --no-progress --verbose --accept {{vars.links_accept}} --base-url https://jseverino.com --exclude '^https://jseverino\\.com' $(git ls-files -- 'src/content/*.md' 'src/content/*.mdx')"

# ------------------------------------------------------------------- tools
# Every other command. A task whose script takes arguments passes them through
# untouched (`raw_args`), `--help` included: `mise run site validate`,
# `mise run cloudflare plan --json`. A task whose output another program reads
# runs `quiet` with `output = "interleave"`, so mise adds no line and no
# task-name prefix to its stdout.

[tasks.site]
description = "The publishing workflow CLI: `mise run site <command>` (validate, publish, land, featured, manage, …)"
raw_args = true
interactive = true
quiet = true
run = "node bin/site.ts"

[tasks.dev]
description = "Start the local dev server"
depends = ["sync:worker-types"]
raw_args = true
interactive = true
run = "astro dev"

[tasks."fix:lint"]
description = "Apply Biome's safe fixes and formatting to the files biome.jsonc covers, and report what it cannot fix"
run = "biome check --write"

[tasks."sync:content"]
description = "Pull published content from the vault into the repo"
raw_args = true
run = "node bin/sync-content.ts"

[tasks."sync:contract"]
description = "Regenerate typed content-contract projections"
raw_args = true
run = "node bin/sync-content-contract.ts"

[tasks."sync:contact-openapi"]
description = "Regenerate contact OpenAPI from its request contract"
raw_args = true
run = "node bin/sync-contact-openapi.ts"

# Gitignored, so every task that type-checks or resolves `Env` depends on this
# one, as Cloudflare directs: `wrangler types` before any task that relies on
# TypeScript. Warnings and errors only, so a gate run does not print the Env.
[tasks."sync:worker-types"]
description = "Write the Worker's `Env` and runtime types from wrangler.jsonc into src/generated/worker-configuration.d.ts"
env = { WRANGLER_LOG = "warn" }
run = "wrangler types src/generated/worker-configuration.d.ts"

[tasks."sync:tokens"]
description = "Pull design and brand tokens from `severino-brand` into the repo"
raw_args = true
run = "node bin/sync-tokens.ts"

[tasks."diff:build"]
description = "Build HEAD and the working tree; show what changed in the shipped site"
raw_args = true
run = "node bin/diff-build.ts"

[tasks."deploy:verify"]
description = "After the merge deploys, from a residential IP: verify remote CI and the live production deploy"
raw_args = true
quiet = true
output = "interleave"
run = "node bin/deploy-verify.ts"

[tasks."publish:dist"]
description = "Commit a build directory to the `dist` branch (CI publishes it on every push to `main`)"
raw_args = true
run = "node bin/publish-dist.ts"

[tasks.cloudflare]
description = "`check` diffs the live zone and account against `cloudflare/zone.json` (read token; exit 1 on drift), `plan` lists the API calls an apply would make, `apply --yes` makes them (edit token; owned rules only)"
raw_args = true
quiet = true
output = "interleave"
run = "node bin/cloudflare.ts"

[tasks.github]
description = "`check` diffs the live repository settings, security features, Actions permissions, and `main` ruleset against `.github/repo.json` (exit 1 on drift), `plan` lists the API calls an apply would make, `apply --yes` makes them (admin token)"
raw_args = true
quiet = true
output = "interleave"
run = "node bin/github.ts"

[tasks."preview:wrap"]
description = "Turn the finished build into a branch preview: add the review viewer, then rebuild the CSP to cover it"
run = "node bin/wrap-preview.ts"

[tasks.preview]
description = "Serve the build through the local Worker runtime: _headers, redirects, the 404 page and the API routes, as production serves them"
raw_args = true
run = "astro preview"

[tasks."dev:look"]
description = "Screenshot pages of the build as `preview` serves it, at each width in light and dark, to see a layout change; exit 1 on a page that scrolls sideways or fails to load"
raw_args = true
timeout = "30m"
run = "node bin/dev-look.ts"

# Through the binding, so the database name stays in wrangler.jsonc alone.
# Every statement in d1.sql is IF NOT EXISTS, so a re-run adds only what is
# new. interactive: wrangler asks before it runs a file against production.
[tasks."d1:schema"]
description = "Apply `cloudflare/d1.sql` to the D1 database bound as `DB`: `local` (the one `mise run preview` serves) or `remote` (production)"
interactive = true
usage = '''
arg "<database>" help="The local database or production" {
  choices "local" "remote"
}
'''
run = "wrangler d1 execute DB --$usage_database --file=cloudflare/d1.sql"

[tasks.lighthouse]
description = "Lighthouse against the live site with the URLs and thresholds in `tests/lighthouse.json` (needs Chrome; CI runs it weekly)"
run = "node bin/lighthouse-check.ts"

[tasks."make:icons"]
description = "Regenerate favicons and brand marks"
raw_args = true
run = "node bin/make-icons.ts"

[tasks."make:og"]
description = "Regenerate the Open Graph card"
run = "node bin/make-og-image.ts"

[tasks."make:embed"]
description = "Regenerate `public/embed/bundle.css`, the embeddable stylesheet (brand vars, base.css, inlined Inter)"
raw_args = true
run = "node bin/make-embed-bundle.ts"

[tasks."make:social"]
description = "Regenerate the GitHub social preview"
run = "node bin/make-github-social.ts"

[tasks."make:content-index"]
description = "Emit the published-writeup JSON projection consumed by Severino HQ"
run = "node bin/make-content-index.ts"

[tasks."snapshot:github"]
description = "Refresh the committed GitHub repo snapshot, the only source the portfolio Software list reads for repos"
run = "node bin/snapshot-github.ts"

[tasks."snapshot:software"]
description = "Refresh the committed PyPI/npm snapshot (versions, monthly downloads); fails without writing if any lookup fails"
run = "node bin/snapshot-software.ts"

[tasks."sign:security"]
description = "Re-sign `public/.well-known/security.txt`"
interactive = true
run = "node bin/sign-security.ts"

[tasks."clean:generated"]
description = "Remove build output (`dist/`), `.astro/` and the Vite cache; shared caches and synced content stay"
run = "rm -rf dist .astro node_modules/.vite"

[tasks."setup:browsers"]
description = "Install the named Playwright browsers and their system packages"
timeout = "20m"
usage = '''
arg "<browser>..." help="A browser to install" {
  choices "chromium" "firefox" "webkit"
}
'''
run = "playwright install --with-deps $usage_browser"
