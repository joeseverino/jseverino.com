# The static gates, before a build: `mise run checks` (alias fast) runs every
# checks:* gate here and under mise-tasks/checks/.

["checks:contracts"]
description = "Each generated projection (brand tokens, contact OpenAPI, content schemas, embed CSS, vector brand marks) matches what its script derives from the canonical source"
hide = true
run = "mise run -c -q sync:tokens --check ::: sync:contact-openapi --check ::: sync:contract --check ::: make:embed --check ::: make:icons --check"

["checks:drafts"]
description = "No document under src/content is `published: false`"
hide = true
run = "node tests/audits/check-no-drafts.ts"

["checks:security-txt"]
description = "security.txt is clear-signed with a valid signature, carries the RFC 9116 fields, expires at least 60 days out, and its Encryption URL names a committed WKD key"
hide = true
run = "node tests/audits/check-security-txt.ts"

["checks:types"]
description = "Every TypeScript file compiles under one strict program, and the Worker's routes again under the Workers runtime types wrangler.jsonc declares"
hide = true
depends = ["sync:worker-types"]
# astro sync writes the generated types under .astro/ that tsc reads.
run = ["astro sync --silent", "tsc -p .", "tsc -p src/tsconfig.worker.json"]

["checks:astro"]
description = "`astro check` reports no errors or warnings in the .astro files, content schemas, or imports"
hide = true
depends = ["sync:worker-types"]
# astro sync and astro check both rewrite .astro/; never at once.
wait_for = ["checks:types"]
env = { NODE_OPTIONS = "--max-old-space-size=4096" }
run = "astro check --silent --minimumSeverity warning --tsconfig src/tsconfig.astro.json"

["checks:d1"]
description = "The contact handler consumes the contact contract, every INSERT names only columns cloudflare/d1.sql defines, and wrangler.jsonc binds the site's D1 database"
hide = true
run = "node tests/audits/check-d1-parity.ts"

["checks:unit"]
description = "The node:test specs under tests/unit pass"
hide = true
run = "node --test --test-reporter=./tests/unit/helpers/quiet-reporter.ts 'tests/unit/**/*.test.ts'"

["checks:docs"]
description = "Every `mise run` task and backticked repo path in the engineering docs resolves, and no doc runs an npm script"
hide = true
run = "node tests/audits/check-docs.ts {{vars.docs}}"

["checks:doc-links"]
description = "Every relative link, image, and #anchor (GitHub heading slugs) in the engineering docs resolves"
hide = true
run = "lychee --offline --include-fragments --no-progress --root-dir '{{config_root}}' $(git ls-files -- {{vars.docs}})"

["checks:lint"]
description = "Biome finds no formatting difference and no lint finding at warning or above in the files biome.jsonc covers"
hide = true
run = "biome ci --error-on-warnings || { status=$?; echo 'fix: mise run fix:lint, fix what it reports it cannot, then commit the result' >&2; exit $status; }"

["checks:css-vars"]
description = "Every CSS custom property defined in src/styles is referenced somewhere in src/"
hide = true
run = "node tests/audits/check-css.ts"

["checks:repo-policy"]
description = "Node and npm pins agree; the Worker compatibility date is within 90 days of the installed workerd's; no secrets or build output tracked; component styles live in src/styles; TypeScript only, no unexplained type-check suppressions; no floating `-latest` runner labels, and every job sets a timeout"
hide = true
run = "node tests/audits/check-repository-policy.ts"

["checks:workflows"]
description = "zizmor finds no security issue in the workflows; an accepted finding carries an inline reason"
hide = true
# Offline: the online audits need a token and the network, and a gate gives the
# same verdict on a laptop and in CI.
run = "zizmor --offline --quiet .github"

["checks:actionlint"]
description = "jactionlint finds no syntax, expression, action-input or shellcheck error in the workflows or actions"
hide = true
# The correctness profile is actionlint's checks; zizmor (checks:workflows)
# owns the security audits.
run = "jactionlint --profile correctness --no-hints"

["checks:shellcheck"]
description = "ShellCheck finds nothing in the file tasks under mise-tasks/, each checked as the shell its shebang names"
hide = true
# The .toml files there are task files, not scripts.
run = "find mise-tasks -type f ! -name '*.toml' -exec shellcheck {} +"

["checks:renovate"]
description = "Renovate's own validator finds no error, warning or needed migration in .github/renovate.json"
hide = true
# Pinned here and moved by .github/renovate.json's regex manager for this file.
# npm prints only errors, so the deprecation warnings of Renovate's own
# dependencies stay out of the gate's output. The exact pin is the gate on the
# release, so the machine's npm release-age hold does not apply to this fetch.
env = { npm_config_loglevel = "error", npm_config_min_release_age = "0" }
run = "npx --yes --package renovate@44.176.3 -- renovate-config-validator --strict --no-global .github/renovate.json"

["checks:tasks"]
description = "`mise tasks validate` finds no error in the task definitions: no dependency cycle, missing task, bad usage spec, timeout, glob or file task"
hide = true
run = "mise tasks validate --errors-only"

["checks:patch"]
description = "No whitespace error or conflict marker in any tracked file; synced content may keep trailing spaces and blank last lines"
hide = true
# Against the empty tree, so every tracked file is checked, edited or not.
# Synced content keeps the trailing double space that Markdown reads as a line
# break, so only its end-of-line rules are relaxed, and its conflict markers
# still fail.
run = [
  "git diff --check $(git hash-object -t tree /dev/null) -- . ':!src/content' ':!tests/fixtures/content'",
  "git -c core.whitespace=-blank-at-eol,-blank-at-eof diff --check $(git hash-object -t tree /dev/null) -- src/content tests/fixtures/content",
]
